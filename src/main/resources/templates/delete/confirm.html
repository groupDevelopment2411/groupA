<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="common/common :: head">
    <title>社員削除確認</title>
</head>
<body>
    <header th:insert="common/common :: header"></header>

    <main>

        <h1>社員削除確認</h1>
        
        <p>以下の社員を削除します。よろしいですか？</p>
        
        <form th:action="@{/delete/result}" method="post">
            <table class="comfirmID">
                <div>
                    <th>社員ID:</th>
                </div>
                <td th:each="employee : ${employees}">
                    <span th:text="${employee.id}"></span>
                    <span th:text="${employee.name}"></span>
                    <input type="hidden" name="ids" th:value="${employee.id}" />
                </td>
            </table>
            <wrap class="buttonWrap">
                <button type="submit" class="button">削除</button>
                <button class="button"><a th:href="@{/dummy/success}">キャンセル</a></button>
            </wrap>
        </form>


    </main>
    
    <footer th:replace="common/common :: footer"></footer>
</body>
</html>
