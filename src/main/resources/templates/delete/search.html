<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>社員削除検索</title>
</head>
<body>
    <header>
        <div th:insert="common/common :: header"></div>
    </header>
    <h1>社員削除検索</h1>
    <form th:action="@{/delete/confirm}" method="get" th:object="${deleteForm}">
        <label for="id">社員ID：</label>
        <input type="text" name="ids" id="id">
        <button type="submit">削除</button>
    </form>
    <p th:if="${errorMsg}" th:text="${errorMsg}"></p>
    <footer>
        <div th:replace="common/common :: footer"></div>
    </footer>
</body>
</html>
