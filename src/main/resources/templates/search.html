<!DOCTYPE html>
<html  xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社員情報検索</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .error-message {
      color: red;
      font-weight: bold;
      margin: 20px 0;
      padding: 10px;
      border: 2px solid red;
      background-color: #fdd;
    }
    .info-message {
      color: blue;
      font-weight: bold;
      margin: 20px 0;
    }
  </style>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="/validation.js"></script>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body>
  <div class="main-header">
    <div class="menu-title">
      <h1>社員情報検索</h1>
    </div>
    <header th:replace="~{fragments/header}"></header>
  </div>

  <div class="info-message">
    <p>以下の条件で検索を行います：</p>
    <ul>
      <li>条件チェック：（開始）と（終了）は左が右を上回らないようにする。</li>
    </ul>
  </div>

  <!-- 🔻🔻 ここにエラーメッセージを追加！🔻🔻 -->
  <div class="error-message" th:if="${error != null}">
    <p th:utext="${error}"></p>
  </div>

  <div class="search-container">
	<form id="searchForm" th:action="@{/search}" method="get">
      <div class="form-group">
        <label for="employeeId" class="form-label">社員ID（数値のみ）</label>
		<input type="text" id="employeeId" name="id" class="form-input" placeholder="社員ID">
      </div>
      <div class="form-group">
        <label for="name" class="form-label">社員名</label>
        <input type="text" id="name" name="name" class="form-input" placeholder="社員名" autocomplete="on" >
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="ageFrom" class="form-label">年齢（開始）</label>
          <input type="text" id="ageFrom" name="ageFrom" class="form-input" placeholder="年齢（開始）">
        </div>
        <div class="form-group">
          <label for="ageTo" class="form-label">年齢（終了）</label>
          <input type="text" id="ageTo" name="ageTo" class="form-input" placeholder="年齢（終了）">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="startDateFrom" class="form-label">開始日（開始）</label>
          <input type="text" id="startDateFrom" name="startDateFrom" class="form-input" placeholder="yyyy/MM/dd">
        </div>
        <div class="form-group">
          <label for="startDateTo" class="form-label">開始日（終了）</label>
          <input type="text" id="startDateTo" name="startDateTo" class="form-input" placeholder="yyyy/MM/dd">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="endDateFrom" class="form-label">終了日（開始）</label>
          <input type="text" id="endDateFrom" name="endDateFrom" class="form-input" placeholder="yyyy/MM/dd">
        </div>
        <div class="form-group">
          <label for="endDateTo" class="form-label">終了日（終了）</label>
          <input type="text" id="endDateTo" name="endDateTo" class="form-input" placeholder="yyyy/MM/dd">
        </div>
      </div>
      <button type="submit">検索</button>
      <button type="reset">クリア</button>
    </form>
  </div>

  <div class="results-info" th:if="${employees != null}">
      <p th:if="${employees.size() > 0}">検索結果: <span th:text="${employees.size()}"></span>件</p>
      <p th:if="${employees.size() == 0}" style="color: red;">検索結果が見つかりませんでした。</p>
  </div>

  <form action="/delete" method="post">
    <div class="results-container" th:if="${employees != null}">
      <table>
        <thead>
          <tr>
            <th>選択</th>
            <th>ID</th>
            <th>名前</th>
            <th>部署</th>
            <th>年齢</th>
            <th>開始日</th>
            <th>終了日</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="employee : ${employees}">
            <td>
              <input type="checkbox" name="selectedIds" th:value="${employee.id}">
            </td>
            <td th:text="${employee.id}"></td>
            <td th:text="${employee.name}"></td>
            <td th:text="${employee.department}"></td>
            <td th:text="${employee.age}"></td>
            <td th:text="${employee.startDate}"></td>
            <td th:text="${employee.endDate}"></td>
          </tr>
        </tbody>
      </table>
      <button type="submit">選択した項目を削除</button>
    </div>
  </form>

  <div class="action-buttons">
    <a href="/" class="button">メニュー</a>
    <a href="/register" class="button">登録</a>
  </div>

  <footer th:replace="~{fragments/footer}"></footer>
</body>
</html>
